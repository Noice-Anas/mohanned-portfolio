<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found — Mohanned Albosh</title>
<link rel="icon" href="/mohanned-portfolio/assets/icons/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100dvh;display:grid;place-items:center;padding:24px;
    font-family:'IBM Plex Sans',system-ui,sans-serif;color:#0f1b34;
    background:radial-gradient(900px 500px at 50% -10%,rgba(37,99,235,.10),transparent 60%),
      linear-gradient(180deg,#ffffff,#f6f8fc)}
  .box{text-align:center;max-width:520px}
  .logo{width:64px;height:64px;border-radius:17px;margin:0 auto 26px;color:#fff;
    display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-weight:600;
    font-size:24px;letter-spacing:1px;background:linear-gradient(135deg,#3b74f0,#12328f);
    box-shadow:0 16px 34px -14px #1d4ed8}
  .code{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;
    letter-spacing:.2em;color:#1d4ed8;text-transform:uppercase}
  h1{font-size:clamp(28px,6vw,42px);font-weight:600;letter-spacing:-1px;margin-top:12px}
  p{margin-top:14px;color:#5b6b88;font-size:17px;line-height:1.6}
  p .ar{font-family:'IBM Plex Sans Arabic',sans-serif;direction:rtl}
  .btn{display:inline-flex;align-items:center;gap:8px;margin-top:28px;height:48px;
    padding-inline:24px;border-radius:12px;background:#1d4ed8;color:#fff;font-weight:600;
    font-size:16px;text-decoration:none;box-shadow:0 14px 28px -12px #1d4ed8;
    transition:background .2s ease,transform .15s ease}
  .btn:hover{background:#12328f}
  .btn:active{transform:translateY(1px)}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">MA</div>
    <div class="code">Error 404</div>
    <h1>This page took a wrong turn.</h1>
    <p>
      The page you're looking for doesn't exist or has moved.
      <br /><span class="ar">الصفحة التي تبحث عنها غير موجودة.</span>
    </p>
    <a class="btn" href="/mohanned-portfolio/">Back to homepage</a>
  </div>
</body>
</html>
